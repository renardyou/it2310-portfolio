<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Renard's Coffee Shop</title>

    <style>
        
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }

        body {
          font-family: "Lora", Georgia, "Times New Roman", serif;
          min-height: 100vh;
          display: grid;
          grid-template-rows: auto auto 1fr auto;
          grid-template-areas:
            "header"
            "nav"
            "main"
            "footer";
          background-color: #fdfbd4; 
        }

       
        .header {
          grid-area: header;
          background-color: #3c2f2f;
          color: #fdfbd4;           
          text-align: center;
          padding: 2rem;
        }

        .header h1 {
          font-size: 2.5rem;
          letter-spacing: 0.1em;
        }

        .header p {
          margin-top: 0.5rem;
          font-size: 1.1rem;
        }

       
        .nav {
          grid-area: nav;
          background-color: #6f4e37; 
        }

        .nav ul {
          display: flex;
          justify-content: center;
          gap: 2rem;
          list-style: none;
          padding: 1rem 0;
        }

        .nav a {
          color: #fdfbd4;
          text-decoration: none;
          font-weight: bold;
          letter-spacing: 0.05em;
        }

        .nav a:hover {
          text-decoration: underline;
        }

        
        .main-content {
          grid-area: main;
          background-color: #dfccaf; 
          padding: 2rem;
        }

        .main-content h2 {
          text-align: center;
          color: #3c2f2f;
          margin-bottom: 1.5rem;
        }

       
        .footer {
          grid-area: footer;
          background-color: #3c2f2f;
          color: #fdfbd4;
          text-align: center;
          padding: 1rem;
          font-size: 0.9rem;
        }

        
        .flex-container {
          display: flex;
          justify-content: center;
          flex-wrap: wrap;
          gap: 1.5rem;
        }

        .flex-item {
          background-color: #6f4436;
          color: #fdfbd4;
          padding: 2rem 3rem;
          border-radius: 10px;
          font-size: 1.1rem;
          font-weight: bold;
          text-align: center;
          min-width: 150px;
          box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        }

       
        @media (max-width: 600px) {
          .nav ul {
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
          }

          .flex-item {
            width: 100%;
          }

          .main-content {
            padding: 1.5rem 1rem;
          }
        }
    </style>

</head>

<body>

    <header class="header">

        <h1>Renard's Coffee Shop</h1>

        <p>Your daily dose of caffeine and comfort.</p>

    </header>
 

    <nav class="nav">

        <ul>

            <li><a href="#menu">Menu</a></li>

            <li><a href="#about">About Us</a></li>

            <li><a href="#contact">Contact</a></li>

        </ul>

    </nav>
 

    <main class="main-content">

        <h2>Featured Coffees</h2>

        <div class="flex-container">

            <div class="flex-item">Espresso</div>

            <div class="flex-item">Cappuccino</div>

            <div class="flex-item">Latte</div>

            <div class="flex-item">Mocha</div>

        </div>

    </main>
 

    <footer class="footer">

        <p>&copy; 2025 Java Haven. All Rights Reserved.</p>

    </footer>

</body>

</html>
