<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lab 8 - Interactive Button</title>

    <style>

        body {

            font-family: Arial, sans-serif;

            text-align: center;

            margin-top: 50px;

        }

        button {

            font-size: 20px;

            padding: 10px 20px;

            background-color: #4CAF50;

            color: white;

            border: none;

            border-radius: 5px;

            cursor: pointer;
            

        }

        button:hover {

            background-color: #45a049;

        }
    #myDIV {
    width: 300px;
    height: 300px;
    background-color: coral;
    color: white;
}
    </style>

</head>

<body>

    <h1>Welcome to My Page</h1>

    <p id="greeting"></p>

    <button id="nameButton">Click Me!</button>

    <p id="newParagraph"></p>

    <button onclick="myFunction()">Try it</button>
    <div id="myDIV" style="width:100%;height:100px;"></div>

 

    <script>

       document.write("<p>Created by: Renard Young</p>");
       const button = document.getElementById('nameButton');
       button.addEventListener('click',() => {
          const user = prompt('What is your name?');
            if (user) {
                alert(`Hello, ${user}!`);
                button.style.backgroundColor = 'red';
                document.getElementById('greeting').textContent = `Hello, ${user}!`;
                document.getElementById('newParagraph').textContent = 'Have a great day!';
            } else {
                alert('No name entered.');
                button.style.backgroundColor = '#4CAF50';
                document.getElementById('newParagraph').textContent = '';
            }
       });
    
        function myFunction() {
        const div = document.getElementById("myDIV");
        if (div.style.backgroundColor === "lightblue") {
            div.style.backgroundColor = "red";
        } else {
            div.style.backgroundColor = "lightblue";
        }
}

    </script>

</body>

</html>
